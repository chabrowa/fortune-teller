services:
  jenkins:
    build: .
    container_name: jenkins
    # local use only
    user: root
    ports:
      - "8080:8080"
    environment:
      KUBECONFIG: /kube/config
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # local use only
      - ${HOME}/.kube/config:/kube/config:ro
    restart: unless-stopped

volumes:
  jenkins_home: